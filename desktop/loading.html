      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #1a1a1f;
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
        overflow: hidden;
                border-radius: 30px;
      }
      .canvas {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: transparent;
        border-radius: 30px;
      }

      /* Main splash card — perfectly straight */
      .splash {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 400px 1fr;
        background: #ffffff;
                border-radius: 30px;
        overflow: hidden;
      }
      .info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 42px 34px 32px 42px;
      }
      .title-block .app-icon {
        width: 72px; height: 72px;
        border-radius: 20px;
        object-fit: cover;
        display: block;
        margin-bottom: 22px;
        -webkit-user-drag: none;
        user-drag: none;
      }
      .app-name {
        margin: 0;
        font-size: 46px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: #1a1a1f;
      }
      .app-name .accent { color: #9b3f68; }
      .app-sub {
        margin: 10px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8a8f9c;
        line-height: 1.5;
        max-width: 260px;
      }
      .legal .credit {
        margin: 0 0 6px;
        font-size: 12px;
        color: #565b68;
        font-weight: 500;
      }
      .legal .credit b { color: #1a1a1f; font-weight: 700; }
      .legal .copyright b { color: #565b68; font-weight: 700; }
      .legal .copyright {
        margin: 0;
        font-size: 10.5px;
        line-height: 1.55;
        color: #a0a5b0;
      }
      .loading-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .loading-dots {
        display: inline-flex;
        gap: 4px;
      }
      .loading-dots span {
        width: 5px; height: 5px; border-radius: 50%;
        background: #9b3f68;
        animation: bob 1.1s ease-in-out infinite;
      }
      .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
      .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bob {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-4px); opacity: 1; }
      }
      .loading-label {
        font-size: 13px;
        font-weight: 600;
        color: #565b68;
        letter-spacing: 0.02em;
      }
      .status {
        margin: 0;
        font-size: 11px;
        color: #a0a5b0;
        min-height: 15px;
      }
      .status.error { color: #d9534f; }

      /* Right artwork panel */
      .art {
        position: relative;
        overflow: hidden;
        background: #f6f3ee;
      }
      .art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        -webkit-user-drag: none;
        user-drag: none;
      }

      .version {
        position: absolute;
        bottom: 14px;
        right: 18px;
        font-size: 11px;
        color: rgba(26, 26, 31, 0.7);
        letter-spacing: 0.04em;
        z-index: 5;
        padding: 5px 14px;
        border-radius: 999px;
        background: #ffffff;
        border: 1px solid rgba(20, 24, 34, 0.1);
        box-shadow: 0 2px 8px rgba(20, 24, 34, 0.06);
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
      <div class="splash">
        <div class="info">
          <div class="title-block">
            <img class="app-icon" src="icon.png" alt="" draggable="false" />
            <p class="app-name">Fig <span class="accent">POS</span></p>
            <p class="app-sub">New &amp; used phones · IMEI tracking · Credit &amp; analytics</p>
          </div>

          <div class="legal">
            <p class="credit">Crafted with care by <b>Wavlon Studio</b>.</p>
            <p class="copyright">Fig POS is proudly built in Pakistan by <b>MYKO Pvt Ltd</b>.<br/>© 2026 Fig POS. All rights reserved.</p>
          </div>

          <div>
            <div class="loading-row">
              <span class="loading-dots"><span></span><span></span><span></span></span>
              <span class="loading-label">Loading application...</span>
            </div>
            <p class="status" id="status">Starting…</p>
          </div>
        </div>

        <div class="art">
          <img id="splashImg" src="spalsh_1.png" alt="" draggable="false" />
        </div>
      </div>

      <div class="version" id="version"></div>

    <script>
      (function () {
        try {
          if (window.fig && window.fig.theme && window.fig.theme.get) {
            window.fig.theme.get().then(function (t) {
              if (t && /^[a-z0-9]+$/.test(t)) document.documentElement.dataset.theme = t;
            }).catch(function () {});
          }
        } catch (e) {}

        var q = new URLSearchParams(window.location.search);
        var ver = q.get("v");
        if (ver) document.getElementById("version").textContent = "v" + ver;

        var img = document.getElementById("splashImg");
        if (img) img.src = "spalsh_1.png";

        var el = document.getElementById("status");
        if (window.fig && window.fig.loading && window.fig.loading.onStatus) {
          window.fig.loading.onStatus(function (text) {
            if (!text) return;
            el.textContent = text;
            if (/not start|fail|error|could not/i.test(text)) {
              el.className = "status error";
            }
          });
        }
      })();
    </script>
  </body>
