appId: com.fig.pos
productName: Fig Mobile POS
directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - logging.js
  - report.js
  - loading.html
  - error.html
  - runtime.json
  - package.json
  - fig-report-token.txt

# Bundle only the FINAL builds (no source, no node_modules except the native
# module bundled inside backend/dist/node_modules).
extraResources:
  - from: ../backend/dist
    to: backend
  - from: ../frontend/.next/standalone
    to: frontend
  - from: ../frontend/.next/static
    to: frontend/.next/static
  - from: ../frontend/public
    to: frontend/public

npmRebuild: true

# Windows is the only target platform.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false