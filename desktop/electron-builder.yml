appId: com.fig.pos
productName: Fig POS
directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - logging.js
  - report.js
  - loading.html
  - about.html
  - icon.png
  - spalsh_1.png
  - spalsh_2.png
  - error.html
  - runtime.json
  - package.json
  - fig-report-token.txt

# Bundle the production builds (no source, no node_modules except the native
# module bundled inside production/backend/native).
extraResources:
  - from: ../production/backend
    to: production/backend
    filter:
      - "**/*"
  - from: ../production/frontend
    to: production/frontend
    filter:
      - "**/*"

npmRebuild: true

# OTA updates via GitHub Releases. electron-builder generates latest.yml +
# blockmap so installed apps can self-update without re-downloading.
publish:
  provider: github
  owner: mykopk
  repo: Mobile-Shop-POS

# Windows is the only release target. macOS is not built or released.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false