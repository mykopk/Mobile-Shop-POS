appId: com.fig.pos
productName: Fig Mobile POS
directories:
  output: release
  buildResources: build

files:
  - main.js
  - preload.js
  - logging.js
  - report.js
  - loading.html
  - error.html
  - runtime.json
  - package.json
  - fig-report-token.txt

# Bundle the production builds (no source, no node_modules except the native
# module bundled inside production/backend/native).
extraResources:
  - from: ../production/backend
    to: production/backend
    filter:
      - "**/*"
  - from: ../production/frontend
    to: production/frontend
    filter:
      - "**/*"

npmRebuild: true

# OTA updates via GitHub Releases. electron-builder generates latest.yml +
# blockmap so installed apps can self-update without re-downloading.
publish:
  provider: github
  owner: mykopk
  repo: Mobile-Shop-POS

# Windows + macOS are both supported targets.
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.business
  artifactName: ${productName}-${version}-mac.${ext}

dmg:
  title: ${productName} ${version}