<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
    <title>Fig Mobile POS — Error</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #f6f5f2;
        color: #1f2937;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        display: flex;
        flex-direction: column;
      }
      .head {
        padding: 14px 18px;
        background: #fff;
        border-bottom: 1px solid #e5e7eb;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: #dc2626;
      }
      .head b { font-size: 14px; }
      .body { flex: 1; overflow: auto; padding: 14px 18px; }
      pre {
        margin: 0; white-space: pre-wrap; word-break: break-word;
        background: #111827; color: #e5e7eb;
        border-radius: 10px; padding: 12px;
        font-size: 12px; line-height: 1.5; max-height: 320px; overflow: auto;
      }
      .foot {
        padding: 12px 18px; background: #fff; border-top: 1px solid #e5e7eb;
        display: flex; gap: 8px; justify-content: flex-end;
      }
      button {
        border: none; border-radius: 8px; padding: 8px 14px;
        font-size: 13px; font-weight: 600; cursor: pointer;
        background: #0f766e; color: #fff;
      }
      button.grey { background: #e5e7eb; color: #1f2937; }
      button.danger { background: #dc2626; color: #fff; }
      p.hint { font-size: 11px; color: #6b7280; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="head"><span class="dot"></span><b id="title">Fig Mobile POS encountered an error</b></div>
    <div class="body"><pre id="detail">Loading…</pre></div>
    <div class="foot">
      <button class="grey" id="openLogs">Open log folder</button>
      <button id="copy">Copy error</button>
      <button class="danger" id="close">Close</button>
    </div>
    <script>
      (async () => {
        const detail = await window.fig.error.get();
        const title = new URLSearchParams(location.search).get("t");
        if (title) document.getElementById("title").textContent = decodeURIComponent(title);
        document.getElementById("detail").textContent = detail || "No details available.";
        document.getElementById("copy").onclick = async () => {
          await window.fig.error.copy(detail || "");
          document.getElementById("copy").textContent = "Copied ✓";
        };
        document.getElementById("openLogs").onclick = () => window.fig.logs.open();
        document.getElementById("close").onclick = () => window.close();
      })();
    </script>
  </body>
</html>
