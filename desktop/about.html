      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: transparent;
        color: #1a1a1f;
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
        overflow: hidden;
      }
      .canvas {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: transparent;
      }
      .card {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 400px 1fr;
        background: #ffffff;
        border-radius: 30px;
        overflow: hidden;
      }
      .info {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 38px 34px 30px 42px;
      }
      .title-block .app-icon {
        width: 72px; height: 72px;
        border-radius: 20px;
        object-fit: cover;
        display: block;
        margin-bottom: 18px;
        -webkit-user-drag: none;
        user-drag: none;
      }
      .app-name {
        margin: 0;
        font-size: 42px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.03em;
        color: #1a1a1f;
      }
      .app-name .accent { color: #9b3f68; }
      .app-sub {
        margin: 10px 0 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #8a8f9c;
        line-height: 1.5;
        max-width: 260px;
      }
      .meta {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .meta-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 12.5px;
        gap: 16px;
      }
      .meta-row .k { color: #a0a5b0; font-weight: 600; }
      .meta-row .v { color: #443f37; font-weight: 700; }

      .legal .credit {
        margin: 0 0 6px;
        font-size: 12px;
        color: #565b68;
        font-weight: 500;
      }
      .legal .credit b { color: #1a1a1f; font-weight: 700; }
      .legal .copyright b { color: #565b68; font-weight: 700; }
      .legal .copyright {
        margin: 0;
        font-size: 10.5px;
        line-height: 1.55;
        color: #a0a5b0;
      }
      .update {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 76px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 16px;
        font-weight: 600;
        font-size: 14px;
        font-family: inherit;
        padding: 10px 18px;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease;
        -webkit-user-select: none;
        user-select: none;
      }
      .btn-primary { background: var(--brand-600); color: #ffffff; }
      .btn-primary:hover:not(:disabled) { background: var(--brand-700); }
      .btn-secondary { background: var(--brand-50); color: var(--brand-600); }
      .btn-secondary:hover:not(:disabled) { background: var(--brand-100); }
      .btn-grey { background: var(--ink-100); color: var(--ink-700); }
      .btn-grey:hover:not(:disabled) { background: var(--ink-200); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      .update-line {
        font-size: 12px;
        color: #565b68;
        font-weight: 500;
        min-height: 16px;
      }
      .update-line.error { color: #d9534f; }
      .update-line.good { color: #2f9e44; }
      .spinner {
        display: inline-block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,0.35);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .spinner.dark {
        border-color: rgba(0,0,0,0.15);
        border-top-color: currentColor;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      .art {
        position: relative;
        overflow: hidden;
        background: #f6f3ee;
      }
      .art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        -webkit-user-drag: none;
        user-drag: none;
      }
      .close-btn {
        position: absolute;
        top: 16px;
        right: 18px;
        width: 34px; height: 34px;
        border-radius: 50%;
        border: 1px solid rgba(20, 24, 34, 0.1);
        background: #ffffff;
        color: #565b68;
        font-size: 18px;
        font-family: inherit;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(20, 24, 34, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 6;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .close-btn:hover { background: #f3efe7; color: #1a1a1f; }
    </style>

  <body>
    <div class="canvas">
      <div class="card">
        <div class="info">
          <div class="title-block">
            <img class="app-icon" src="icon.png" alt="" draggable="false" />
            <p class="app-name">Fig <span class="accent">POS</span></p>
            <p class="app-sub">New &amp; used phones · IMEI tracking · Credit &amp; analytics</p>
          </div>

          <div class="meta">
            <div class="meta-row"><span class="k">Version</span><span class="v" id="ver">–</span></div>
            <div class="meta-row"><span class="k">Runtime</span><span class="v" id="runtime">–</span></div>
            <div class="meta-row"><span class="k">Channel</span><span class="v" id="channel">–</span></div>
          </div>

          <div>
            <div class="update">
              <div class="update-line" id="updateLine">Checking for updates…</div>
              <div id="updateActions">
                <button class="btn btn-primary" id="btnCheck">Check for updates</button>
              </div>
            </div>
            <div class="legal" style="margin-top: 16px;">
              <p class="credit">Crafted with care by <b>Wavlon Studio</b>.</p>
              <p class="copyright">Fig POS is proudly built in Pakistan by <b>MYKO Pvt Ltd</b>.<br/>© 2026 Fig POS. All rights reserved.</p>
            </div>
          </div>
        </div>

        <div class="art">
          <img id="splashImg" src="spalsh_1.png" alt="" draggable="false" />
          <button class="close-btn" id="closeBtn" title="Close" aria-label="Close">&#10005;</button>
        </div>
      </div>
    </div>

    <script>
      (function () {
        try {
          if (window.fig && window.fig.theme && window.fig.theme.get) {
            window.fig.theme.get().then(function (t) {
              if (t && /^[a-z0-9]+$/.test(t)) document.documentElement.dataset.theme = t;
            }).catch(function () {});
          }
        } catch (e) {}

        var img = document.getElementById("splashImg");
        if (img) img.src = "spalsh_2.png";

        var closeBtn = document.getElementById("closeBtn");
        if (closeBtn) {
          closeBtn.addEventListener("click", function () {
            if (window.fig && window.fig.about && window.fig.about.close) window.fig.about.close();
          });
        }

        var verEl = document.getElementById("ver");
        var q = new URLSearchParams(window.location.search);
        var ver = q.get("v");
        if (ver) verEl.textContent = "v" + ver;
        else if (window.fig && window.fig.about && window.fig.about.info) {
          window.fig.about.info().then(function (info) {
            if (!info) return;
            if (!ver && info.version) verEl.textContent = "v" + info.version;
            if (info.runtime) document.getElementById("runtime").textContent = info.runtime;
            if (info.channel) document.getElementById("channel").textContent = info.channel;
          }).catch(function () {});
        }

        var line = document.getElementById("updateLine");
        var actions = document.getElementById("updateActions");
        var btnCheck = document.getElementById("btnCheck");

        function setLine(text, cls) {
          line.textContent = text;
          line.className = "update-line" + (cls ? " " + cls : "");
        }

        function render(state) {
          if (!state) return;
          if (state.checking) {
            setLine("Checking for updates…");
            actions.innerHTML = '';
          } else if (state.available && !state.downloaded) {
            setLine("Version " + (state.newVersion || "") + " is available.");
            actions.innerHTML = '<button class="btn btn-primary" id="btnDl"><span class="spinner" id="dlSpin" style="display:none"></span><span id="dlTxt">Download update</span></button>';
            var btnDl = document.getElementById("btnDl");
            if (btnDl) btnDl.addEventListener("click", function () {
              document.getElementById("dlSpin").style.display = "inline-block";
              document.getElementById("dlTxt").textContent = "Downloading…";
              if (window.fig && window.fig.update) window.fig.update.download();
            });
          } else if (state.downloading) {
            setLine("Downloading update…");
            actions.innerHTML = '<button class="btn btn-primary" disabled><span class="spinner"></span>Downloading…</button>';
          } else if (state.downloaded) {
            setLine("Update ready. Restart to apply.");
            actions.innerHTML = '<button class="btn btn-primary" id="btnInstall">Restart &amp; install</button>';
            var btnInstall = document.getElementById("btnInstall");
            if (btnInstall) btnInstall.addEventListener("click", function () {
              if (window.fig && window.fig.update) window.fig.update.install();
            });
          } else if (state.error) {
            setLine("Update failed: " + state.error, "error");
            actions.innerHTML = '';
            renderActions();
          } else {
            setLine("You are on the latest version.", "good");
            actions.innerHTML = '';
            renderActions();
          }
        }

        function renderActions() {
          actions.innerHTML = '<button class="btn btn-grey" id="btnCheck2">Check for updates</button>';
          var b = document.getElementById("btnCheck2");
          if (b) b.addEventListener("click", function () {
            if (window.fig && window.fig.update) window.fig.update.check();
          });
        }

        if (btnCheck) {
          btnCheck.addEventListener("click", function () {
            if (window.fig && window.fig.update) window.fig.update.check();
          });
        }

        if (window.fig && window.fig.update && window.fig.update.onStatus) {
          window.fig.update.onStatus(function (state) { render(state); });
          window.fig.update.status().then(function (state) { render(state); }).catch(function () {});
        } else {
          setLine("Updates are not available in this build.", "good");
          actions.innerHTML = '';
        }
      })();
    </script>
  </body>
</html>
