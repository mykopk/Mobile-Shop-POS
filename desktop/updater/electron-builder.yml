appId: com.fig.pos.updater
productName: Fig POS Updater
directories:
  output: release
  buildResources: ../build

files:
  - main.js
  - preload.js
  - index.html

win:
  target:
    - portable
  icon: build/icon.ico
  artifactName: Fig-POS-Updater-${version}.${ext}

# Standalone exe — no installer, no publish feed of its own.
publish: null