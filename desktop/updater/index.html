<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'" />
  <title>Fig POS Updater</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f5f2; color: #1c1b1a; height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 24px;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: #6b675f; font-size: 12px; margin: 0 0 20px; }
    .bar {
      height: 8px; border-radius: 6px; background: #e4e1da; overflow: hidden;
    }
    .fill { height: 100%; width: 0%; background: #14532d; transition: width .2s; }
    .status { margin-top: 12px; font-size: 13px; color: #3c3935; min-height: 18px; }
    button {
      margin-top: 20px; border: 0; border-radius: 8px; padding: 9px 16px;
      background: #14532d; color: #fff; font-size: 14px; cursor: pointer;
    }
    button:disabled { background: #c6c2ba; cursor: default; }
    .err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>Fig Mobile POS — Updater</h1>
  <p class="sub">Fetches the latest version and re-installs it. Works even if the app itself is broken.</p>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="status" id="status">Click Update to check for a newer version.</div>
  <button id="update">Update now</button>

  <script>
    const fill = document.getElementById("fill");
    const status = document.getElementById("status");
    const btn = document.getElementById("update");

    btn.addEventListener("click", () => {
      btn.disabled = true;
      status.classList.remove("err");
      status.textContent = "Checking…";
      fill.style.width = "0%";
      window.updater.start();
    });

    window.updater.onStatus(({ text, percent }) => {
      status.textContent = text;
      status.classList.toggle("err", percent === -1);
      if (percent > 0) fill.style.width = percent + "%";
      if (percent === 100) setTimeout(() => btn.disabled = false, 1000);
    });
  </script>
</body>
</html>
