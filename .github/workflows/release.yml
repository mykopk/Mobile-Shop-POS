name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver like 1.2.3). Leave empty to auto-bump the patch."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Bump the version, regenerate the changelog, and push a tag. The tag is then
  # used by the build job below. No tag trigger on this workflow, so pushing it
  # never re-triggers the run.
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            CURRENT=$(node -p "require('./desktop/package.json').version")
            VERSION=$(node -e "const [m,j,p]=process.argv[1].split('.').map(Number); console.log(m+'.'+j+'.'+(p+1))" "$CURRENT")
          fi
          ./scripts/version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: ./scripts/changelog.sh "${{ steps.version.outputs.version }}"

      - name: Commit + tag
        run: |
          rm -f .release-notes.md
          git add backend/package.json frontend/package.json desktop/package.json CHANGELOG.md
          git commit -m "v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags

  # Build the Windows installer from the newly-created tag and publish the
  # GitHub Release (installer + latest.yml + blockmap for OTA self-updates).
  build:
    needs: release
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/updater/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install updater deps
        working-directory: desktop/updater
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:4701
        run: npm run build

      # Prepare the self-contained production frontend bundle (renames
      # node_modules -> deps so electron-builder doesn't prune 'next'). Must run
      # after npm run build.
      - name: Prepare production frontend bundle
        working-directory: frontend
        run: npm run build:production

      # Rebuild the backend's native module (better-sqlite3) for Windows + Electron.
      - name: Rebuild native modules
        working-directory: desktop
        run: npm run rebuild

      # Bundle the self-contained production backend (esbuild + native module +
      # schema.sql + setup.cjs) into production/backend.
      - name: Build production backend
        working-directory: backend
        run: npm run build:production

      # Bake the crash-report token (from a GitHub secret) into the installer.
      # The token file is gitignored and never committed.
      - name: Inject crash-report token
        env:
          FIG_GH_TOKEN: ${{ secrets.FIG_GH_TOKEN }}
        run: printf '%s' "$FIG_GH_TOKEN" > desktop/fig-report-token.txt

      - name: Package installer
        working-directory: desktop
        run: npm run dist:win

      # Unpacked build — lets you test on Windows with NO installation: extract
      # the zip and run "Fig Mobile POS.exe" directly.
      - name: Build unpacked (no-install) test build
        working-directory: desktop
        run: npm run pack:win

      - name: Zip unpacked test build
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          tar -a -c -f "release/Fig.Mobile.POS-${VERSION}-no-install.zip" -C release/win-unpacked .

      # Build the standalone updater exe (portable, single file).
      - name: Build updater
        working-directory: desktop/updater
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fig-pos-setup
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
            desktop/release/*-no-install.zip
            desktop/updater/release/Fig-POS-Updater-*.exe
          if-no-files-found: error

      - name: Generate changelog release notes
        run: ./scripts/changelog.sh "${{ needs.release.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
            desktop/updater/release/Fig-POS-Updater-*.exe
          body_path: .release-notes.md