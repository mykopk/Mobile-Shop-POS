name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver like 1.2.3). Leave empty to auto-bump the patch."
        required: false
        default: ""

permissions:
  contents: write

# This workflow ONLY bumps the version, regenerates CHANGELOG.md, commits and
# pushes a tag. The tag push triggers .github/workflows/build-desktop.yml which
# builds the Windows installer and creates the GitHub Release. This keeps a
# single build pipeline and a single source of release notes.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            CURRENT=$(node -p "require('./desktop/package.json').version")
            VERSION=$(node -e "const [m,j,p]=process.argv[1].split('.').map(Number); console.log(m+'.'+j+'.'+(p+1))" "$CURRENT")
          fi
          ./scripts/version.sh "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: ./scripts/changelog.sh "${{ steps.version.outputs.version }}"

      - name: Commit + tag
        run: |
          rm -f .release-notes.md
          git add backend/package.json frontend/package.json desktop/package.json CHANGELOG.md
          git commit -m "v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags