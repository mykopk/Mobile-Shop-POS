name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Rebuild the backend's native module (better-sqlite3) for Windows + Electron.
      - name: Rebuild native modules
        working-directory: desktop
        run: npm run rebuild

      - name: Package installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fig-pos-setup
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Upload unpacked app
        uses: actions/upload-artifact@v4
        with:
          name: fig-pos-win-unpacked
          path: desktop/release/win-unpacked
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          generate_release_notes: true