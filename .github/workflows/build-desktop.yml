name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # Rebuild the backend's native module (better-sqlite3) for Windows + Electron.
      - name: Rebuild native modules
        working-directory: desktop
        run: npm run rebuild

      # Bundle the backend (esbuild) + copy the rebuilt native module into dist.
      - name: Build backend
        working-directory: backend
        run: npm run build && npm run copy-native

      # Bake the crash-report token (from a GitHub secret) into the installer.
      # The token file is gitignored and never committed.
      - name: Inject crash-report token
        env:
          FIG_GH_TOKEN: ${{ secrets.FIG_GH_TOKEN }}
        run: printf '%s' "$FIG_GH_TOKEN" > desktop/fig-report-token.txt

      - name: Package installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fig-pos-setup
          path: desktop/release/*.exe
          if-no-files-found: error

      - name: Generate changelog release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog.sh "${GITHUB_REF#refs/tags/v}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/release/*.exe
          body_path: .release-notes.md