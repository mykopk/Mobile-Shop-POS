name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json
            desktop/updater/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci && npx prisma generate

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Install updater deps
        working-directory: desktop/updater
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:4701
        run: npm run build

      # Prepare a self-contained frontend bundle (renames node_modules -> deps so
      # electron-builder doesn't prune 'next'). Must run after npm run build.
      - name: Prepare frontend bundle
        working-directory: frontend
        run: node scripts/prepare-standalone.mjs

      # Rebuild the backend's native module (better-sqlite3) for Windows + Electron.
      - name: Rebuild native modules
        working-directory: desktop
        run: npm run rebuild

      # Bundle the backend (esbuild) + copy the rebuilt native module into dist.
      - name: Build backend
        working-directory: backend
        run: npm run build && npm run copy-native

      # Bake the crash-report token (from a GitHub secret) into the installer.
      # The token file is gitignored and never committed.
      - name: Inject crash-report token
        env:
          FIG_GH_TOKEN: ${{ secrets.FIG_GH_TOKEN }}
        run: printf '%s' "$FIG_GH_TOKEN" > desktop/fig-report-token.txt

      - name: Package installer
        working-directory: desktop
        run: npm run dist:win

      # Unpacked build — lets you test on Windows with NO installation: extract
      # the zip and run "Fig Mobile POS.exe" directly.
      - name: Build unpacked (no-install) test build
        working-directory: desktop
        run: npm run pack:win

      - name: Zip unpacked test build
        working-directory: desktop
        run: |
          VERSION=$(node -p "require('./package.json').version")
          powershell Compress-Archive -Path release/win-unpacked/* -DestinationPath "release/Fig.Mobile.POS-${VERSION}-no-install.zip" -Force

      # Build the standalone updater exe (portable, single file).
      - name: Build updater
        working-directory: desktop/updater
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fig-pos-setup
          path: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
            desktop/release/*-no-install.zip
            desktop/updater/release/Fig-POS-Updater-*.exe
          if-no-files-found: error

      - name: Generate changelog release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog.sh "${GITHUB_REF#refs/tags/v}"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/latest.yml
            desktop/release/*.exe.blockmap
            desktop/updater/release/Fig-POS-Updater-*.exe
          body_path: .release-notes.md