# Render blueprint — Fig Mobile POS backend (Express + Prisma + SQLite)
# Deploy: New → Blueprint → select this repo (root of blueprint = repo root).
# The web service runs from `backend/` (rootDir), keeps the SQLite DB on a
# persistent disk at /data, and auto-migrates + seeds on every deploy.

services:
  - type: web
    name: fig-mobile-backend
    runtime: node
    repo: https://github.com/mykopk/Mobile-Shop-POS
    rootDir: backend
    plan: free
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:/data/fig.db
      - key: CORS_ORIGIN
        value: https://your-frontend-url.com
        comment: |
          Comma-separated origins allowed to call the API (the frontend origin).
          Credentials-based cookie auth requires an exact origin, not *.
          Replace before first deploy or the API still boots but only serves
          that origin.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_ROUNDS
        value: "10"
      - key: LOGIN_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "5"
    disk:
      name: fig-data
      mountPath: /data
      sizeGB: 1
